version: '3.8'
# 部署后端 (及可选前端) 容器
# 启动：docker-compose -f docker-compose-app-v1.0.yml up -d
# 停止：docker-compose -f docker-compose-app-v1.0.yml down
# 日志：docker logs -f my-blog-backend
services:
  # ─────────────────────────────────────────────
  # 前端部署 (可选)：如需部署前端，取消下面注释，并准备 ./nginx/html (前端构建产物)、./nginx/conf 目录
  # ─────────────────────────────────────────────
  # nginx:
  #   image: registry.cn-hangzhou.aliyuncs.com/xfg-studio/nginx:latest
  #   container_name: nginx
  #   restart: always
  #   ports:
  #     - '80:80'
  #   volumes:
  #     - ./nginx/html:/usr/share/nginx/html
  #     - ./nginx/conf/nginx.conf:/etc/nginx/nginx.conf
  #     - ./nginx/conf/conf.d:/etc/nginx/conf.d
  #   privileged: true

  # ─────────────────────────────────────────────
  # 后端部署 - my-blog
  # 镜像由 build.sh 构建：grey/my-blog-backend:1.0
  # 默认使用 dev profile (application.yml 已配 active: dev)，连远程 36.151.145.26 的 MySQL/Redis/MinIO
  # 访问地址：http://<服务器IP>:8894/api
  # ─────────────────────────────────────────────
  my-blog-backend:
    image: grey/my-blog-backend:1.0
    container_name: my-blog-backend
    restart: on-failure
    ports:
      - "8894:8894"
    environment:
      - TZ=Asia/Shanghai
      # 默认 dev profile，无需额外传参；如需切换 profile：
      # - PARAMS=--spring.profiles.active=prod
      # 如后端与 MySQL/Redis/MinIO 同机部署 (容器内 localhost 访问不到宿主机)，可用环境变量覆盖连接地址：
      # - SPRING_DATASOURCE_URL=jdbc:mysql://host.docker.internal:13306/greysblog
      # - SPRING_DATA_REDIS_HOST=host.docker.internal
      # - SPRING_DATA_REDIS_PORT=16379
      # - MINIO_ENDPOINT=http://host.docker.internal:9010
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./logs:/app/logs
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
